plugins {
	id 'fabric-loom' version '1.9.1'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
    maven { url "https://maven.fabricmc.net/" }
    maven { url "https://repo.spongepowered.org/maven/" }  // Mixin 라이브러리
	    maven {
        url 'https://files.minecraftforge.net/maven/'
    }
    maven { url 'https://libraries.minecraft.net' }
    mavenCentral()
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"modid" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

dependencies {
    minecraft "com.mojang:minecraft:1.21.1"
    mappings loom.officialMojangMappings()

    // ✅ 최신 Fabric API 추가
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.102.1+1.21.1"

    // ✅ Mixin (Fabric 내장 버전 사용)
    modImplementation "net.fabricmc:sponge-mixin:0.12.5+mixin.0.8.5"

    // ✅ Fabric Rendering API 추가 (HUD 관련)
    modImplementation "net.fabricmc.fabric-api:fabric-rendering-data-attachment-v1:0.3.57+73761d2e04"

    // ✅ Fabric Loom (필수!)
    modImplementation "net.fabricmc:fabric-loom:1.9.1"
}


processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}